name: WPF Migration Preview
on:
  push:
    branches: [wpf-migration]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish standalone WPF app
        run: dotnet publish wpf/CAWForge.Wpf.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: CAWForge-WPF-Preview-Windows
          path: dist/
