name: WPF Migration Preview
on:
  push:
    branches: [wpf-migration]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download face detection classifier
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Models | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/opencv/opencv/4.10.0/data/haarcascades/haarcascade_frontalface_default.xml" -OutFile dist/Models/haarcascade_frontalface_default.xml
          if ((Get-Item dist/Models/haarcascade_frontalface_default.xml).Length -lt 100000) { throw "Face classifier download is incomplete." }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/opencv/opencv/4.10.0/data/haarcascades/haarcascade_eye_tree_eyeglasses.xml" -OutFile dist/Models/haarcascade_eye_tree_eyeglasses.xml
          if ((Get-Item dist/Models/haarcascade_eye_tree_eyeglasses.xml).Length -lt 100000) { throw "Eye classifier download is incomplete." }
      - name: Publish standalone WPF app
        run: dotnet publish wpf/CAWForge.Wpf.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o dist
      - name: Bundle local Real-ESRGAN Vulkan upscaler
        shell: pwsh
        run: |
          $url = "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile realesrgan-windows.zip
          Expand-Archive realesrgan-windows.zip -DestinationPath realesrgan-extracted -Force
          $exe = Get-ChildItem realesrgan-extracted -Recurse -Filter realesrgan-ncnn-vulkan.exe | Select-Object -First 1
          if (-not $exe) { throw "Real-ESRGAN executable missing from release." }
          $models = Join-Path $exe.Directory.FullName "models"
          if (-not (Test-Path $models)) { throw "Real-ESRGAN models missing from release." }
          New-Item -ItemType Directory -Force -Path dist/AI | Out-Null
          Copy-Item (Join-Path $exe.Directory.FullName "*") dist/AI -Recurse -Force
          if (-not (Test-Path dist/AI/models/realesrgan-x4plus.param)) { throw "AI model files missing." }
      - name: Prepare optional template reference folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Templates | Out-Null
          Set-Content -Path dist/Templates/README.txt -Value "Add actual WWE 2K26 template screenshots here, named M1.png through M20.png and F1.png through F21.png (or .jpg). The app compares visual appearance only; this is not landmark detection. The reference images are not included in the build."
      - uses: actions/upload-artifact@v4
        with:
          name: CAWForge-WPF-Preview-Windows
          path: dist/
