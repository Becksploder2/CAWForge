name: CAWForge Windows Test Build
on:
  workflow_dispatch:
  push:
    branches: [main, feature/attire-auto-seam-connect]
    paths:
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'assets/**'
      - 'viewer.html'
      - 'ai_behavior_studio.html'
      - '.github/workflows/windows-test.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Validate source and assets
        shell: pwsh
        run: |
          if (!(Test-Path main.go)) { throw 'main.go is missing. Upload CAWForge source before building.' }
      - name: Compile Windows GUI
        shell: pwsh
        run: |
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          $env:CGO_ENABLED='0'
          # This repository is currently a standalone stdlib-only main.go without go.mod.
          $env:GO111MODULE='off'
          go build -ldflags="-H windowsgui" -o CAWForge_Studio_Windows.exe main.go
      - name: Verify Windows executable header
        shell: pwsh
        run: |
          $exe = 'CAWForge_Studio_Windows.exe'
          if (!(Test-Path $exe)) { throw 'Windows executable was not created.' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes.Length -lt 512 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid Windows MZ executable header.' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length -or [Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE`0`0") { throw 'Invalid Windows PE signature.' }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ('Unexpected PE machine type: 0x{0:X4}' -f $machine) }
          Write-Host ('Validated x64 Windows PE: {0} bytes' -f $bytes.Length)
      - name: Smoke-test GUI startup on Windows
        shell: pwsh
        run: |
          # The app is a GUI program: successful startup means it remains alive
          # briefly, not that it exits with status zero.
          $exe = (Resolve-Path 'CAWForge_Studio_Windows.exe').Path
          $process = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              throw ('CAWForge exited during startup (code {0}).' -f $process.ExitCode)
            }
            Write-Host ('GUI process remained running after startup: PID {0}' -f $process.Id)
          }
          finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Stage app and preserve template folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/CAWForge | Out-Null
          Copy-Item CAWForge_Studio_Windows.exe dist/CAWForge/
          if (Test-Path assets) { Copy-Item assets dist/CAWForge/assets -Recurse }
          foreach ($file in @('viewer.html','ai_behavior_studio.html','WWE_2K26_Master_Prompt.txt','local-engine.exe')) {
            if (Test-Path $file) { Copy-Item $file dist/CAWForge/ }
          }
          Write-Host 'Template packs are optional; users can add them to assets/templates locally.'
      - name: Upload test ZIP (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: CAWForge-Windows-Test
          path: dist/CAWForge/
          if-no-files-found: error
          retention-days: 14
